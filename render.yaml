# Render Blueprint: one free Python web service. The database is Neon Postgres (external, free tier).
# Hourly collection is triggered by .github/workflows/hourly-collect.yml (Render free plan has no cron jobs).
services:
  - type: web
    name: my-news-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: WIKI_CONTACT
        sync: false
